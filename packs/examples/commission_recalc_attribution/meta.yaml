id: PAY-01
name: Commission attribution and recalculation
objective: >
  (a) Identify commissions paid to someone other than the person who made the
  sale. (b) Recalculate commission as rate x sale total and flag differences
  above a tolerance.
assertion: accuracy
risk: >
  Commission is paid to the wrong person, or is calculated incorrectly, so
  payroll cost and the commission liability are misstated.
category: financial
contract:
  sales:
    required: {sale_id: string, employee_id: string, total_amount: decimal}
  commissions:
    required: {sale_id: string, employee_id: string, commission_amount: decimal}
  people:
    required: {person_id: string, commission_rate: ratio}
parameters:
  tolerance: {type: decimal, default: "1.00"}
systemic_note: {rule: recalc, role: commissions, threshold: 0.5}
amount_column: amount_at_risk
initial_label:
  attribution: likely_error
  recalc: inquiry
needs_client_confirmation:
  attribution: false
  recalc: true
limitations: >
  Example pack for one commission scheme. The recalculation assumes commission =
  rate of the selling employee x sale total; the client's real rule (tax
  excluded, tiers, caps, returns) may differ, so recalculation differences are
  inquiries until the rule is confirmed. Commissions with no matching sale are
  reported by REV-02, not here.
