[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-workbench"
version = "0.1.0"
description = "Local-first audit data analytics workbench: integrity gate, SQL test packs, Excel workpaper."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "duckdb==1.5.6",
    "pandas==3.0.5",
    "openpyxl==3.1.5",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
review = ["streamlit==1.67.0"]

[project.scripts]
workbench = "workbench.cli:main"

[tool.setuptools]
packages = ["workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
